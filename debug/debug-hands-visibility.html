<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Hand Visibility - GLTF Loading Analysis</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: white;
            font-family: monospace;
        }
        #scene-container {
            width: 100%;
            height: 400px;
            border: 2px solid #16213e;
            position: relative;
        }
        .debug-info {
            background: #0f0f23;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #eee3cb;
        }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
        .warning { color: #ffd43b; }
        .info { color: #339af0; }
    </style>
</head>
<body>
    <h1>🔍 Debug Hand Visibility - GLTF Analysis</h1>
    
    <div class="debug-info">
        <h3>Loading Status:</h3>
        <div id="loading-status">Initializing...</div>
    </div>

    <div id="scene-container"></div>

    <div class="debug-info">
        <h3>🛠️ Debug Information:</h3>
        <div id="debug-log"></div>
    </div>

    <div class="debug-info">
        <h3>📊 Model Analysis:</h3>
        <div id="model-analysis"></div>
    </div>

    <!-- Three.js Dependencies -->
    <script src="vendor/threejs/three.min.js"></script>
    <script src="vendor/threejs/OrbitControls.js"></script>
    <script src="vendor/threejs/GLTFLoader.js"></script>

    <script>
        console.log('🚀 Starting Debug Hand Visibility Test');
        
        let scene, camera, renderer, controls;
        let leftHand, rightHand;
        let debugLog = [];
        
        function logDebug(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}`;
            console.log(logEntry);
            debugLog.push(`<div class="${type}">${logEntry}</div>`);
            document.getElementById('debug-log').innerHTML = debugLog.join('');
        }

        function updateStatus(message) {
            document.getElementById('loading-status').innerHTML = message;
        }

        function updateModelAnalysis(analysis) {
            document.getElementById('model-analysis').innerHTML = analysis;
        }

        // Initialize Three.js Scene
        function initScene() {
            logDebug('Initializing Three.js scene...', 'info');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2a2a2a);

            // Camera with optimal positioning from Playwright test results
            const container = document.getElementById('scene-container');
            const aspect = container.clientWidth / container.clientHeight;
            camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
            camera.position.set(0, 0.2, 3.5);  // Optimal position from tests
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Controls for debugging
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            logDebug('Scene initialization complete', 'success');
            return true;
        }

        // Test GLTF loading with detailed analysis
        async function testHandLoading() {
            logDebug('🔍 Starting detailed GLTF hand loading test...', 'info');
            updateStatus('Loading hand models...');
            
            const loader = new THREE.GLTFLoader();
            let loadResults = {
                leftHand: null,
                rightHand: null,
                errors: []
            };

            // Test left hand loading
            try {
                logDebug('📂 Testing left hand file: assets/models/hand_left.gltf', 'info');
                const leftGltf = await new Promise((resolve, reject) => {
                    loader.load('assets/models/hand_left.gltf', 
                        (gltf) => {
                            logDebug('✅ LEFT HAND loaded successfully!', 'success');
                            resolve(gltf);
                        },
                        (progress) => {
                            logDebug(`Left hand loading progress: ${(progress.loaded/progress.total*100).toFixed(1)}%`, 'info');
                        },
                        (error) => {
                            logDebug(`❌ LEFT HAND loading failed: ${error.message}`, 'error');
                            reject(error);
                        }
                    );
                });
                
                leftHand = setupHandModel(leftGltf, 'left');
                scene.add(leftHand);
                loadResults.leftHand = leftGltf;
                
            } catch (error) {
                logDebug(`💥 Left hand critical error: ${error.message}`, 'error');
                loadResults.errors.push(`Left: ${error.message}`);
            }

            // Test right hand loading
            try {
                logDebug('📂 Testing right hand file: assets/models/hand_right.gltf', 'info');
                const rightGltf = await new Promise((resolve, reject) => {
                    loader.load('assets/models/hand_right.gltf', 
                        (gltf) => {
                            logDebug('✅ RIGHT HAND loaded successfully!', 'success');
                            resolve(gltf);
                        },
                        (progress) => {
                            logDebug(`Right hand loading progress: ${(progress.loaded/progress.total*100).toFixed(1)}%`, 'info');
                        },
                        (error) => {
                            logDebug(`❌ RIGHT HAND loading failed: ${error.message}`, 'error');
                            reject(error);
                        }
                    );
                });
                
                rightHand = setupHandModel(rightGltf, 'right');
                scene.add(rightHand);
                loadResults.rightHand = rightGltf;
                
            } catch (error) {
                logDebug(`💥 Right hand critical error: ${error.message}`, 'error');
                loadResults.errors.push(`Right: ${error.message}`);
            }

            // Analysis
            analyzeLoadingResults(loadResults);
            
            if (loadResults.leftHand || loadResults.rightHand) {
                updateStatus('✅ At least one hand loaded - starting render loop');
                animate();
            } else {
                updateStatus('❌ No hands loaded - check console for errors');
            }
        }

        // Setup hand model with proven optimal positioning
        function setupHandModel(gltf, side) {
            logDebug(`🔧 Setting up ${side} hand model...`, 'info');
            
            const model = gltf.scene;
            
            if (side === 'left') {
                model.position.set(-0.6, -0.1, 0);  // Optimal position from tests
                model.rotation.x = -0.1;
                model.rotation.y = Math.PI / 2;     // +90°
                model.rotation.z = 0;
                model.scale.set(0.4, 0.4, 0.4);    // Optimal scale from tests
            } else {
                model.position.set(0.6, -0.1, 0);   // Optimal position from tests
                model.rotation.x = -0.1;
                model.rotation.y = -Math.PI / 2;    // -90°
                model.rotation.z = 0;
                model.scale.set(0.4, 0.4, 0.4);    // Optimal scale from tests
            }

            // Log positioning details
            logDebug(`${side} hand positioned at: [${model.position.x}, ${model.position.y}, ${model.position.z}]`, 'success');
            logDebug(`${side} hand rotation: [${model.rotation.x}, ${model.rotation.y}, ${model.rotation.z}]`, 'success');
            logDebug(`${side} hand scale: [${model.scale.x}, ${model.scale.y}, ${model.scale.z}]`, 'success');

            return model;
        }

        // Analyze loading results
        function analyzeLoadingResults(results) {
            let analysis = [];
            
            analysis.push('<h4>📊 Loading Analysis:</h4>');
            analysis.push(`<div class="${results.leftHand ? 'success' : 'error'}">Left Hand: ${results.leftHand ? '✅ Loaded' : '❌ Failed'}</div>`);
            analysis.push(`<div class="${results.rightHand ? 'success' : 'error'}">Right Hand: ${results.rightHand ? '✅ Loaded' : '❌ Failed'}</div>`);
            
            if (results.errors.length > 0) {
                analysis.push('<h4>🚨 Errors:</h4>');
                results.errors.forEach(error => {
                    analysis.push(`<div class="error">• ${error}</div>`);
                });
            }

            // Visibility analysis
            if (results.leftHand || results.rightHand) {
                analysis.push('<h4>👁️ Visibility Check:</h4>');
                analysis.push('<div class="info">• Models loaded and added to scene</div>');
                analysis.push('<div class="info">• Camera positioned at optimal distance (3.5 units)</div>');
                analysis.push('<div class="info">• Hands scaled to 0.4 for optimal viewing</div>');
                analysis.push('<div class="info">• Use mouse to orbit around to find hands if not visible</div>');
            }

            updateModelAnalysis(analysis.join(''));
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Window resize handler
        window.addEventListener('resize', () => {
            const container = document.getElementById('scene-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Initialize when THREE.js is ready
        function waitForThree() {
            if (typeof THREE !== 'undefined' && typeof THREE.GLTFLoader !== 'undefined') {
                logDebug('THREE.js and GLTFLoader ready', 'success');
                initScene();
                testHandLoading();
            } else {
                logDebug('Waiting for THREE.js components...', 'warning');
                setTimeout(waitForThree, 100);
            }
        }

        waitForThree();
    </script>
</body>
</html>
